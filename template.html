    <script>
      const menuToggle = document.querySelector(".menu-toggle"),
        primaryMenu = document.querySelector("#primary-menu");
      menuToggle.addEventListener("click", () => {
        const e = "true" === menuToggle.getAttribute("aria-expanded");
        menuToggle.setAttribute("aria-expanded", String(!e));
        primaryMenu.classList.toggle("is-open");
      });
      primaryMenu.querySelectorAll("a").forEach((e) => {
        e.addEventListener("click", () => {
          menuToggle.setAttribute("aria-expanded", "false");
          primaryMenu.classList.remove("is-open");
        });
      });
      primaryMenu.querySelectorAll(".nav-group").forEach((group) => {
        const btn = group.querySelector(".nav-group-btn");
        group.addEventListener("mouseenter", () => btn.setAttribute("aria-expanded", "true"));
        group.addEventListener("mouseleave", () => btn.setAttribute("aria-expanded", "false"));
        group.addEventListener("focusin", () => btn.setAttribute("aria-expanded", "true"));
        group.addEventListener("focusout", (e) => {
          if (!group.contains(e.relatedTarget)) btn.setAttribute("aria-expanded", "false");
        });
      });
    </script>
